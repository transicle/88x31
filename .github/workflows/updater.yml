name: Auto Updater

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-updater
  cancel-in-progress: false

jobs:
  update-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run repository update scripts
        run: |
          bash toolkit/upd-readme.sh

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "chore: monthly repository update"
          git push --force

      - name: Update repository description
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          COUNT=$(find assets -type f \( -iname "*.gif" -o -iname "*.png" -o -iname "*.jpg" \) | wc -l | tr -d ' ')
          FORMATTED=$(echo "$COUNT" | awk '{printf "%\047d", $1}')
          DESCRIPTION="The largest automatically updated 88x31 2000s esque button repository on the internet. ${FORMATTED} unique stickers saved."
          
          curl -s -X PATCH \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d "{\"description\": \"$DESCRIPTION\"}"
